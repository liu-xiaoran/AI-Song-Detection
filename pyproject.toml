[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "ai-song-detection"
version = "0.1.0"
description = "Local, CPU-based AI music screening with a web interface, API, and CLI"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = "Apache-2.0"
dependencies = [
    "fastapi>=0.115.12,<1",
    "numpy>=2.2,<3",
    "onnxruntime>=1.22,<2",
    "python-multipart>=0.0.20,<1",
    "scipy>=1.15,<2",
    "soundfile>=0.13.1,<1",
    "uvicorn>=0.34,<1",
]

[project.scripts]
ai-song-detection = "ai_song_detection.cli:main"

[dependency-groups]
dev = ["build>=1.2,<2", "httpx>=0.28,<1", "pytest>=8.3,<10", "ruff>=0.11,<1"]

[tool.hatch.build.targets.wheel]
packages = ["src/ai_song_detection"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
