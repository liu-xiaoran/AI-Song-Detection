name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: ${{ matrix.python }}
          enable-cache: true
      - name: Prepare pinned CI audio decoder
        shell: bash
        run: |
          decoder_dir="$RUNNER_TEMP/audio-tools"
          mkdir -p "$decoder_dir"
          base_url="https://github.com/eugeneware/ffmpeg-static/releases/download/b6.1.1"
          download_verified() {
            curl --fail --location --retry 3 --connect-timeout 20 --max-time 120 \
              --max-filesize 100000000 "$base_url/$1" --output "$decoder_dir/$1"
            printf '%s  %s\n' "$2" "$decoder_dir/$1" | sha256sum --check
          }
          download_verified ffmpeg-linux-x64.gz bfe8a8fc511530457b528c48d77b5737527b504a3797a9bc4866aeca69c2dffa
          download_verified ffprobe-linux-x64.gz 25d9b6ccb05e3d9de9e04e31e2506d8dd7f9f0418981965ac6df12e8d3afd067
          download_verified linux-x64.LICENSE 8ceb4b9ee5adedde47b31e975c1d90c73ad27b6b165a1dcd80c7c545eb65b903
          download_verified linux-x64.README 72f4b1b06d419d22ace6e7cc75f06826f90737345aa0b1736158929f4aacc537
          gzip -d "$decoder_dir/ffmpeg-linux-x64.gz" "$decoder_dir/ffprobe-linux-x64.gz"
          printf '%s  %s\n' e7e7fb30477f717e6f55f9180a70386c62677ef8a4d4d1a5d948f4098aa3eb99 "$decoder_dir/ffmpeg-linux-x64" | sha256sum --check
          printf '%s  %s\n' 4f231a1960d83e403d08f7971e271707bec278a9ae18e21b8b5b03186668450d "$decoder_dir/ffprobe-linux-x64" | sha256sum --check
          mv "$decoder_dir/ffmpeg-linux-x64" "$decoder_dir/ffmpeg"
          mv "$decoder_dir/ffprobe-linux-x64" "$decoder_dir/ffprobe"
          chmod u+x "$decoder_dir/ffmpeg" "$decoder_dir/ffprobe"
          "$decoder_dir/ffmpeg" -version
          "$decoder_dir/ffprobe" -version
          echo "$decoder_dir" >> "$GITHUB_PATH"
      - run: uv sync --frozen
      - run: uv run ruff check .
      - run: uv run ruff format --check .
      - run: uv run pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: node --test tests/browser/connection.test.cjs
      - run: uv build

  desktop:
    name: Desktop install (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        os: [macos-26, macos-15-intel, windows-2025]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.13.5"
          python-version: "3.12"
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
      - run: uv sync --frozen
      - run: uv run playwright install chromium
      - name: Verify native installer, desktop entry, offline relaunch, and browser UI
        shell: bash
        run: >-
          uv run python scripts/desktop_smoke.py
          --source "$GITHUB_WORKSPACE"
          --work-dir "$RUNNER_TEMP/desktop-install"
          --report-dir "$RUNNER_TEMP/desktop-verification"
          --browser
      - run: uv run pytest -q
      - run: node --test tests/browser/connection.test.cjs
      - name: Retain desktop verification evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-${{ matrix.os }}
          path: ${{ runner.temp }}/desktop-verification
          if-no-files-found: warn
